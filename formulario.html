<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summit Build & Remodel</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f1ec; margin: 0; color: #1c1917; }
  .box { max-width: 560px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px;
         box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  h1 { margin: 0 0 4px; color: #9a3412; }
  p { color: #57534e; }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px;
                    border: 1px solid #d6d3d1; border-radius: 8px; font: inherit; background: #fff; }
  .linha { display: flex; gap: 12px; } .linha label { flex: 1; }
  button { margin-top: 18px; width: 100%; padding: 12px; background: #9a3412; color: #fff;
           border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .dica { font-size: 13px; margin-top: 20px; text-align: center; }
  @media (max-width: 480px) { .linha { flex-direction: column; gap: 0; } }
</style>
</head>
<body>
  <div class="box">
    <h1>Summit Build & Remodel</h1>
    <p>Dallas, TX · Request a free estimate. We reply in minutes.</p>
    <form method="post" action="/pedido">
      <div class="linha">
        <label>Your name <input name="nome" required placeholder="Emily Carter"></label>
        <label>Phone <input name="telefone" required placeholder="(214) 555-0100"></label>
      </div>
      <label>Email <input name="email" type="email" required placeholder="emily@email.com"></label>
      <label>Project type
        <select name="tipo">
          <option>Kitchen remodel</option><option>Bathroom remodel</option><option>Roofing</option>
          <option>Deck / patio</option><option>Home addition</option><option>Repairs / other</option>
        </select></label>
      <div class="linha">
        <label>Budget
          <select name="orcamento">
            <option>Not sure</option><option>Under $10k</option><option>$10k - $30k</option>
            <option>$30k - $75k</option><option>$75k+</option>
          </select></label>
        <label>When do you want to start?
          <select name="prazo">
            <option>ASAP</option><option>1-3 months</option><option>3-6 months</option><option>Just exploring</option>
          </select></label>
      </div>
      <label>Tell us about your project
        <textarea name="mensagem" rows="5" required
          placeholder="We want to fully remodel our 1990s kitchen: new cabinets, quartz countertops and an island."></textarea></label>
      <button>Get my free estimate</button>
    </form>
    <p class="dica"><a href="/painel">Ver painel do dono →</a></p>
  </div>
</body>
</html>
