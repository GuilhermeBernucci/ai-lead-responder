<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Cuts Barbershop</title>
<style>
  :root { --ouro: #c9a227; --fundo: #111; }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--fundo); color: #f5f5f5; }
  header { padding: 56px 16px 32px; text-align: center; }
  header h1 { font-size: 40px; margin: 0; letter-spacing: 1px; }
  header h1 span { color: var(--ouro); }
  header p { color: #bbb; }
  .servicos { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  .servicos div { display: flex; justify-content: space-between; border-bottom: 1px solid #2a2a2a; padding: 10px 0; }
  .links { text-align: center; margin: 28px 0; font-size: 13px; }
  .links a { color: var(--ouro); margin: 0 8px; }
  /* Chat */
  #chat { position: fixed; right: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px));
          background: #fff; color: #111; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
          display: flex; flex-direction: column; overflow: hidden; }
  #chat .topo { background: var(--ouro); color: #111; padding: 12px 16px; font-weight: 700; }
  #msgs { height: 320px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .bot { background: #f0f0f0; align-self: flex-start; }
  .eu { background: #111; color: #fff; align-self: flex-end; }
  form { display: flex; border-top: 1px solid #eee; }
  input { flex: 1; border: 0; padding: 12px; font: inherit; outline: none; }
  button { border: 0; background: #111; color: #fff; padding: 0 16px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1>FRESH <span>CUTS</span></h1>
    <p>Barbershop · 120 Ocean Dr, Miami · Mon-Sat 9am-7pm</p>
  </header>
  <section class="servicos">
    <div><span>Haircut</span><span>$35</span></div>
    <div><span>Skin Fade</span><span>$40</span></div>
    <div><span>Beard Trim</span><span>$20</span></div>
    <div><span>Haircut + Beard</span><span>$50</span></div>
    <div><span>Kids Cut</span><span>$25</span></div>
  </section>
  <p class="links"><a href="/painel">Ver painel do dono →</a><a href="/planos">Ver planos →</a></p>

  <div id="chat">
    <div class="topo">💈 Book with Fresh Cuts · replies instantly</div>
    <div id="msgs"><div class="m bot">Hey! 👋 Want to book a cut? Just tell me what you need and when.</div></div>
    <form id="f"><input id="txt" placeholder="e.g. a fade on Friday at 3pm" autocomplete="off"><button>➤</button></form>
  </div>

<script>
  // A conversa inteira fica guardada aqui e vai junto em cada mensagem,
  // porque a IA não "lembra" de nada sozinha entre uma chamada e outra.
  const conversa = [];
  const msgs = document.getElementById("msgs");

  function mostrar(texto, quem) {
    const div = document.createElement("div");
    div.className = "m " + quem;
    div.textContent = texto;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const campo = document.getElementById("txt");
    const texto = campo.value.trim();
    if (!texto) return;
    campo.value = "";
    mostrar(texto, "eu");
    conversa.push({ role: "user", content: texto });

    const resp = await fetch("/chat", { method: "POST", body: JSON.stringify({ conversa }) });
    const dados = await resp.json();
    mostrar(dados.reply, "bot");
    conversa.push({ role: "assistant", content: dados.reply });
  });
</script>
</body>
</html>
